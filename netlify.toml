# Without this, Netlify publishes the repository root. That serves the raw
# unbundled source — index.html points at /src/main.js, whose bare `three`
# import a browser cannot resolve — so the page loads and the game never
# starts. Build first, publish dist.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints every filename under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry document must not be cached, or a deploy leaves clients pointing at
# asset hashes that no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
